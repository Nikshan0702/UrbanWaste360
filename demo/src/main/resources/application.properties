# Server Configuration
server.port=8080
spring.application.name=demo

# MongoDB Configuration
spring.data.mongodb.uri=mongodb+srv://admin:admin@nikshan.rdttf.mongodb.net/Urban
spring.data.mongodb.database=Urban

# JWT Configuration
app.jwt.secret=mySecretKeyForJWTGenerationInSpringBootApplication2024
app.jwt.expiration=86400000

# CORS Configuration for React Frontend (Vite default ports)
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174

# Enable security so JWT authentication works
app.security.enabled=false

# DevTools Settings
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true

# Logging
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Spring Boot
spring.mvc.format.date=iso